version: "3.9"

services:
  web:
    image: node:22
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace web"
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - ./:/workspace

  media-ai:
    image: python:3.13-slim
    working_dir: /workspace/services/media-ai
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8100"
    ports:
      - "8100:8100"
    env_file:
      - .env.local
    volumes:
      - ./:/workspace

  workers:
    image: python:3.13-slim
    working_dir: /workspace/workers
    command: sh -c "pip install -e . && python -m pytest tests/test_workers.py"
    env_file:
      - .env.local
    volumes:
      - ./:/workspace
